<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700" >
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="logo picture">
      <a 
        class="more-inf" 
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="main-wrapper">
      <section id="add-todo">
        <h3 class="todo-title">Add Item</h3>
        <div class="task-row-wrapper">
          <input 
            id="new-task" 
            class="todo-task input-task" 
            type="text">
          <button class="btn">Add</button>
        </div>
      </section>
      <section>
        <h3 class="todo-title">Todo</h3>
        <ul id="incomplete-tasks">
          <li class="todo-item">
            <input type="checkbox" class="todo-item-checkbox">
            <label class="todo-task">Pay Bills</label>
            <input 
              type="text" 
              class="todo-task input-task">
            <button class="btn edit">Edit</button>
            <button class="btn delete">
              <img src="./remove.svg" alt="close icon" class="remove-icon">
            </button>
          </li>
          <li class="todo-item edit-mode">
            <input type="checkbox" class="todo-item-checkbox">
            <label class="todo-task">Go Shopping</label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="todo-task input-task">
            <button class="btn edit">Save</button>
            <button class="btn delete">
              <img src="./remove.svg" alt="close icon" class="remove-icon">
            </button>
          </li>
        </ul>
      </section>
      <section> 
        <h3 class="todo-title">Completed</h3>
        <ul id="completed-tasks">
          <li class="todo-item">
            <input type="checkbox" checked class="todo-item-checkbox">
            <label class="todo-task completed-label">See the Doctor</label>
            <input 
              type="text" 
              class="todo-task input-task">
            <button class="btn edit">Edit</button>
            <button class="btn delete">
              <img src="./remove.svg" alt="close icon" class="remove-icon">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
