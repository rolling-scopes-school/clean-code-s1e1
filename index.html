<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>

  <body>
    <header class="header">
      <img
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
        class="header__image"
      />
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main class="main">
      <section class="add-task">
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input task" type="text" />
          <button class="add-task__button">Add</button>
        </div>
      </section>

      <section class="todo">
        <h3 class="todo__title">Todo</h3>
        <ul id="incomplete-tasks" class="todo__list">
          <li class="todo__item">
            <input type="checkbox" class="todo__checkbox" />
            <label class="todo__label task">Pay Bills</label>
            <input type="text" class="todo__input task" />
            <button class="todo__edit">Edit</button>
            <button class="todo__delete">
              <img
                src="./remove.svg"
                alt="Delete task"
                class="todo__delete-icon"
              />
            </button>
          </li>

          <li class="todo__item edit-mode">
            <input type="checkbox" class="todo__checkbox" />
            <label class="todo__label task">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="todo__input task"
            />
            <button class="todo__edit">Save</button>
            <button class="todo__delete">
              <img
                src="./remove.svg"
                alt="Delete task"
                class="todo__delete-icon"
              />
            </button>
          </li>
        </ul>
      </section>

      <section class="completed">
        <h3 class="completed__title">Completed</h3>
        <ul id="completed-tasks" class="completed__list">
          <li class="completed__item">
            <input
              type="checkbox"
              checked
              class="completed__checkbox"
            />
            <label class="completed__label task">See the Doctor</label>
            <input type="text" class="completed__input task" />
            <button class="completed__edit">Edit</button>
            <button class="completed__delete">
              <img
                src="./remove.svg"
                alt="Delete task"
                class="completed__delete-icon"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
