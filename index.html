<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="matrix-img-container">
      <img src="./eisenhower-matrix.jpg">
      <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>

    <div class="centered-main-page-element">
	  <p>
      <label for="new-task" class="label-new-task">Add Item</label>
	    <div class="task-row-wrapper">
        <input id="new-task" class="task input-text" type="text">
        <button class="btn" id="add-task-btn">Add</button>
      </div>
      </p>

	  <h3 class="heading">Todo</h3>
      <ul id="incompleteTasks" class="list">
        <li class="list-item">
          <input type="checkbox" class="checkbox"> 
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-edit input-text">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete"><img src="./remove.svg"></button></li>
        <li class="list-item editMode">
          <input type="checkbox" class="checkbox">
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-edit input-text">
          <button class="btn btn-edit">Save</button>
          <button class="btn btn-delete"><img src="./remove.svg"></button>
        </li>
      </ul>
      
      <h3 class="heading">Completed</h3>
	  <ul id="completed-tasks" class="list">
	      <li class="list-item">
          <input type="checkbox" class="checkbox" checked>
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-edit input-text">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete"><img src="./remove.svg"></button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
