<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
<header class="info-box">
    <img class="info-box__image" src="./eisenhower-matrix.jpg" alt="remove">
    <a class="info-box__link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
    </a>
</header>
<main class="main">
    <section class="task-add">
        <label class="task-add__label" for="new-task">Add Item</label>
        <div class="task-add__row">
            <input id="new-task" class="task-add__input" type="text">
            <button class="task-add__button">Add</button>
        </div>
    </section>
    <section class="task-list">
        <h3 class="task-list__title">Todo</h3>
        <ul class="task-list__items" id="incomplete-tasks">
            <li class="task-list__item">
                <input class="task-list__checkbox" type="checkbox">
                <label class="task-list__label">Pay Bills</label>
                <input class="task-list__input" type="text">
                <button class="task-list__button task-list__button--edit">Edit</button>
                <button class="task-list__button task-list__button--delete">
                    <img class="task-list__icon" src="./remove.svg" alt="remove">
                </button>
            </li>
            <li class="task-list__item task-list__item--edit-mode">
                <input class="task-list__checkbox" type="checkbox">
                <label class="task-list__label">Go Shopping</label>
                <input class="task-list__input" type="text" value="Go Shopping">
                <button class="task-list__button task-list__button--edit">Save</button>
                <button class="task-list__button task-list__button--delete">
                    <img class="task-list__icon" src="./remove.svg" alt="remove">
                </button>
            </li>
        </ul>
    </section>
    <section class="task-list task-list--completed">
        <h3 class="task-list__title">Completed</h3>
        <ul class="task-list__items" id="completed-tasks">
            <li class="task-list__item">
                <input class="task-list__checkbox" type="checkbox" checked>
                <label class="task-list__label task-list__label--completed">See the Doctor</label>
                <input class="task-list__input" type="text">
                <button class="task-list__button task-list__button--edit">Edit</button>
                <button class="task-list__button task-list__button--delete">
                    <img class="task-list__icon" src="./remove.svg" alt="remove">
                </button>
            </li>
        </ul>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
