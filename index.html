<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="matrix-reference">
      <img src="./eisenhower-matrix.jpg"
        class="matrix-reference__image" 
        alt="Eisenhower matrix">
      <a class="matrix-reference__link"
        href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <section class="form-section">
      <div class="to-do-app">
        <form id="to-do-form">
          <label class="to-do-form__label" for="new-task">Add Item</label>
          <div class="to-do-form__row">
            <input id="new-task" class="to-do-form__input" type="text">
            <button class="to-do-form__button">Add</button>
          </div>
        </p>
      </div>
    </section>
    <section class="edit-section">
      <h3>Todo</h3>
      <ul class="to-do-list" id="in-complete-tasks">
        <li class="to-do-list__item">
          <input class="to-do-list__checkbox" type="checkbox">
          <label class="to-do-list__label">Pay Bills</label>
          <input type="text" class="to-do-list__text">
          <button class="to-do-list__button to-do-list__button--edit">Edit</button>
          <button class="to-do-list__button to-do-list__button--delete">
            <img src="./remove.svg" src="Delete">
          </button>
        </li>
        <li class="to-do-list__item to-do-list__item--edit-mode">
          <input class="to-do-list__checkbox" type="checkbox">
          <label class="to-do-list__label">Go Shopping</label>
          <input class="to-do-list__text" type="text" value="Go Shopping">
          <button class="to-do-list__button to-do-list__button--save">Save</button>
          <button class="to-do-list__button to-do-list__button--delete">
            <img src="./remove.svg" src="Delete">
          </button>
        </li>
      </ul>
    </section>
    <section class="completed-section">
      <h3>Completed</h3>
      <ul class="to-do-list" id="completed-tasks">
        <li class="to-do-list__item">
          <input class="to-do-list__checkbox" type="checkbox" checked>
          <label class="to-do-list__label">See the Doctor</label>
          <input type="text" class="to-do-list__input">
          <button class="to-do-list__button to-do-list__button--edit">Edit</button>
          <button class="to-do-list__button to-do-list__button--delete">
            <img src="./remove.svg" src="Delete">
          </button>
        </li>
      </ul>
    </section>
    <script type="text/javascript" SRC="app.js"></script>
  </body>
</html>
