<!DOCTYPE html>
<html lang="en">
<head>
  <title>Todo App</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>
  <link href='./style.css' rel='stylesheet'>
</head>
<body>
  <div class="header">
    <img class="header__img" src="./eisenhower-matrix.jpg" alt='logo'>
    <a class='header__more-inf' href="https://goal-life.com/page/method/matrix-eisenhower">Want more details</a>
  </div>
  <div class="main">
    <p id='topSectionForAddingElementToList'>
      <label for="new-task">Add Item</label>
      <div class="add-item__row-wrapper">
        <input id='new-task' class="add-item__task" type="text">
        <button>Add</button>
      </div>
    </p>
    <h3>Todo</h3>
    <ul id='incompleteTasks'>
      <li class="task-item"><input type='checkbox'><label class="task-item__label">Pay Bills</label><input type="text" class="task-item__input"><button class="edit">Edit</button><button class="delete"><img src="./remove.svg"></button></li>
      <li class="task-item editMode"><input type="checkbox"><label class="task-item__label">Go Shopping</label><input type="text" value="Go Shopping" class="task-item__input"><button class='edit'>Save</button><button class="delete"><img src="./remove.svg"></button></li>
    </ul>
    <h3>Completed</h3>
    <ul id="completed-tasks">
      <li class="task-item"><input type="checkbox" checked><label class="task-item__label">See the Doctor</label><input type="text" class="task-item__input"><button class="edit">Edit</button><button class="delete"><img src="./remove.svg"></button></li>
    </ul>
  </div>
  <script type="text/javascript" SRC="app.js"></script>
  </body>
</html>
