<!DOCTYPE html>
<html>

<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body>
  <div class="banner">
    <img class="banner__image" src="./eisenhower-matrix.jpg">
    <a class='banner__link' href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </div>
  <div class="main-page">
    <p id="adding-element">
      <label for="new-task" class="main-page__task-label">Add Item</label>
    <div class="main-page__wrapper">
      <input id="new-task" class="main-page__new-task" type="text">
      <button class="main-page__btn">Add</button>
    </div>
    </p>
    <h3 class="main-page__title">Todo</h3>
    <ul id="incomplete-tasks" class="main-page__list-incomplete main-page__list">
      <li class="main-page__item">
        <input type="checkbox" class="main-page__check">
        <label class="main-page__label">Pay Bills</label>
        <input type="text" class="main-page__input">
        <button class="main-page__edit">Edit</button>
        <button class="main-page__delete">
          <img src="./remove.svg">
        </button>
      </li>
      <li class="main-page__edit-task main-page__item">
        <input type="checkbox" class="main-page__check">
        <label class="main-page__label">Go Shopping</label>
        <input type="text" value="Go Shopping" class="main-page__input">
        <button class="main-page__edit">Save</button>
        <button class="main-page__delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
    <h3 class="main-page__title">Completed</h3>
    <ul id="completed-tasks" class="main-page__list-complete main-page__list">
      <li class="main-page__item">
        <input type="checkbox" checked class="main-page__check">
        <label class="main-page__label">See the Doctor</label>
        <input type="text" class="main-page__input">
        <button class="main-page__edit">Edit</button>
        <button class="main-page__delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>

</html>
