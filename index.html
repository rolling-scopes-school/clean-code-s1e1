<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>

    <header class="matrix-info-header">
        <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix for task prioritization">
        <a class="matrix-info__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>

    <main class="todo-app-container">
        <section class="add-task-section" id="add-task-section">
            <label for="new-task-input">Add Item</label>
            <div class="task-input-wrapper">
                <input id="new-task-input" class="task-input" type="text">
                <button id="add-task-button">Add</button>
            </div>
        </section>

        <section class="task-list-section">
            <h3>Todo</h3>
            <ul id="incomplete-tasks-list">
                <li>
                    <input type="checkbox">
                    <label class="task-label">Pay Bills</label>
                    <input type="text" class="task-text-input">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn"><img src="./remove.svg" alt="Delete icon"></button>
                </li>
                <li class="task-list__item--edit-mode">
                    <input type="checkbox">
                    <label class="task-label">Go Shopping</label>
                    <input type="text" value="Go Shopping" class="task-text-input">
                    <button class="edit-btn">Save</button>
                    <button class="delete-btn"><img src="./remove.svg" alt="Delete icon"></button>
                </li>
            </ul>
        </section>

        <section class="task-list-section">
            <h3>Completed</h3>
            <ul id="completed-tasks-list">
                <li>
                    <input type="checkbox" checked>
                    <label class="task-label">See the Doctor</label>
                    <input type="text" class="task-text-input">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn"><img src="./remove.svg" alt="Delete icon"></button>
                </li>
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
