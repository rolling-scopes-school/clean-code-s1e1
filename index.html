<!DOCTYPE html>
<html>
  <head>
    <title>Eisenhower Matrix Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body>
    <main class="app-container">
      <section class="matrix-container">
        <h1>Eisenhower Matrix Todo</h1>
        <img
          class="matrix-container__img"
          src="./eisenhower-matrix.jpg"
          alt="eisenhower matrix"
        />
        <a
          class="matrix-container__link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
          >Want more details?</a 
        >
      </section>

      <section class="todo-container">
        <h2>
          <label for="todo-container__new-task">Add Item</label>
        </h2>
        <div class="todo-container__btn">
          <input id="todo-container__new-task" class="task" type="text" />
          <button>Add</button>
        </div>
        <h2 class="todo-container__header">Todo</h2>
        <ul id="todo-container__incomplete-tasks">
          <li>
            <input type="checkbox" />
            <label class="task">Pay Bills</label>
            <input type="text" class="task task-input" />
            <button class="edit">Edit</button>
            <button class="delete">
              <img
                class="todo-container__delete-img"
                src="./remove.svg"
                alt="remove icon"
              />
            </button>
          </li>
          <li class="todo-container__edit-mode">
            <input
              class="todo-container__edit-mode__checkbox"
              type="checkbox"
            />
            <label class="task task-label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task task-input" />
            <button class="edit">Save</button>
            <button class="delete">
              <img
                class="todo-container__delete-img"
                src="./remove.svg"
                alt="remove icon"
              />
            </button>
          </li>
        </ul>
        <h2 class="todo-container__header">Completed</h2>
        <ul id="todo-container__complete-tasks">
          <li>
            <input class="edit-mode__input" type="checkbox" checked />
            <label class="task">See the Doctor</label>
            <input type="text" class="task task-input" />
            <button class="edit">Edit</button>
            <button class="delete">
              <img
                class="todo-container__delete-img"
                src="./remove.svg"
                alt="remove icon"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
