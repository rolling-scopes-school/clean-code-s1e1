<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <link 
          href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
          rel="stylesheet"
        >
        <link 
          rel="stylesheet" 
          href="style.css" 
          media="screen" 
          charset="utf-8"
        >
    </head>
    <body class="page">
        <header class="header">
            <h1 class="main-title">TODO</h1>
            <img 
            class="header-image" 
            src="./eisenhower-matrix.jpg"
            alt="Eisenhower matrix"
            >
            <a 
              class="more-info" 
              href="https://goal-life.com/page/method/matrix-eisenhower"
            >
              Want more details?
            </a>
        </header>
        <main class="main">
            <section>
                <h2 class="title new-task-title">
                    <label for="new-task">Add Item</label>
                </h2>
                <div class="task-row">
                    <input class="task-input" id="new-task" type="text">
                    <button class="button">Add</button>
                </div>
            </section>
            <h2 class="title">Todo</h2>
            <ul class="task-list" id="todo-tasks">
                <li class="task-item">
                    <input class="task-checkbox" type="checkbox">
                    <label class="task-label">Pay Bills</label>
                    <input type="text" class="task-input">
                    <button class="button edit">Edit</button>
                    <button class="button delete">
                        <img class="button-image" src="./remove.svg" alt="remove icon">
                    </button>
                </li>
                <li class="task-item edit-mode">
                    <input class="task-checkbox" type="checkbox">
                    <label class="task-label">Go Shopping</label>
                    <input type="text" value="Go Shopping" class="task-input">
                    <button class="button edit">Save</button>
                    <button class="button delete">
                        <img class="button-image" src="./remove.svg" alt="remove icon">
                    </button>
                </li>
            </ul>
            <h2 class="title">Completed</h2>
            <ul class="task-list" id="done-tasks">
                <li class="task-item">
                    <input class="task-checkbox" type="checkbox" checked>
                    <label class="task-label">See the Doctor</label>
                    <input class="task-input" type="text">
                    <button class="button edit">Edit</button>
                    <button class="button delete">
                        <img class="button-image" src="./remove.svg" alt="remove icon">
                    </button>
                </li>
            </ul>
        </main>
        <script src="app.js"></script>
    </body>
</html>
